[project]
name = "puls-events-rag"
dynamic = ["version"]
description = "POC Puls-Events : assistant RAG (LangChain, Mistral, Faiss) qui recommande des événements culturels issus d'Open Agenda."
readme = "README.md"
license = "MIT"
authors = [{ name = "William Derue" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.1",
    "langchain[openai]>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.4",
    "uvicorn>=0.54.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "cashews[redis]>=7.6.0",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "sqlmodel>=0.0.48",
    "python-multipart>=0.0.33",
    "langgraph-checkpoint-sqlite>=3",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
    "pyyaml",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version dérivée du dernier tag git vX.Y.Z (posé par le workflow release).
# Dans l'image Docker, sans .git : SETUPTOOLS_SCM_PRETEND_VERSION.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/puls_events_rag"]

[tool.uv]
# Réinstalle le paquet quand le commit ou les tags changent (version dynamique).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Fenêtre de chat de dev : Gradio vit dans l'environnement du script (PEP 723).
module = ["gradio", "gradio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=puls_events_rag --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: appelle un vrai serveur LLM/embeddings (exclu par défaut en CI de PR)",
]
